<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de React Player</title>
    
    <!-- Cargar React y ReactDOM desde CDN -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    
    <!-- Cargar Babel para compilar JSX en el navegador en tiempo real -->
    <script src="https://unpkg.com"></script>
    
    <!-- Cargar la librería completa de ReactPlayer desde CDN -->
    <script src="https://unpkg.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .video-wrapper {
            position: relative;
            padding-top: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- El script debe tener el tipo "text/babel" para que funcione con JSX -->
    <script type="text/babel">
        function App() {
            // En la versión CDN global, la librería se expone en la variable de ventana global 'ReactPlayer'
            const Player = ReactPlayer.default;

            return (
                <div class="player-container">
                    <h2 style={{ marginTop: 0, color: '#333' }}>Prueba en Vivo de React Player</h2>
                    <div class="video-wrapper">
                        <Player
                            url="https://youtube.com"
                            controls={true}
                            playing={true}
                            muted={true}
                            width="100%"
                            height="100%"
                            onEnded={() => alert('¡El video de YouTube ha finalizado!')}
                        />
                    </div>
                </div>
            );
        }

        // Renderizar el componente en el div #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
